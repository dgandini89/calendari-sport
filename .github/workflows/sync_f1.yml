name: Sync calendario F1

on:
  schedule:
    - cron: "30 5 * * 1"      # ogni lunedì 07:30 ora legale / 06:30 ora solare
  workflow_dispatch:
    inputs:
      reset:
        description: "Cancella tutti gli eventi e ricreali da zero"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-calendario-f1
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python sync_f1.py
        env:
          PYTHONUNBUFFERED: "1"
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          RESET: ${{ inputs.reset }}
