name: Sync calendario Serie A

on:
  schedule:
    - cron: "0 5 * * 1"       # ogni lunedì alle 05:00 UTC (07:00 ora legale / 06:00 ora solare)
  workflow_dispatch:           # pulsante "Run workflow" (anche dall'app GitHub)
    inputs:
      reset:
        description: "Cancella tutti gli eventi e ricreali da zero"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-calendario
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python sync_calendar.py
        env:
          PYTHONUNBUFFERED: "1"
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          RESET: ${{ inputs.reset }}
