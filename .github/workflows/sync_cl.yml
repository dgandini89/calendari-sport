name: Sync calendario Champions League

on:
  schedule:
    - cron: "15 5 * * 1"      # ogni lunedì 07:15 ora legale / 06:15 ora solare
  workflow_dispatch:
    inputs:
      reset:
        description: "Cancella tutti gli eventi e ricreali da zero"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-calendario-cl
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python sync_calcio.py
        env:
          PYTHONUNBUFFERED: "1"
          COMPETITION: "CL"
          ONLY_MY_TEAM: "false"   # "true" = solo le partite dell'Inter
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          RESET: ${{ inputs.reset }}
